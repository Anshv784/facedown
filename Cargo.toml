[workspace]
resolver = "2"
members = ["crates/facedown-core"]
# The dealer is built for wasm32-wasip2 on its own.
exclude = ["dealer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Anshv784/facedown"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
