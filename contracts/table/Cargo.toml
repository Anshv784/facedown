[package]
name = "facedown-table"
description = "No-limit Hold'em tables whose cards are dealt by an OutLayer TDX enclave and audited on chain."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
facedown-core = { path = "../../crates/facedown-core" }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
